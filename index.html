<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森林搬搬忙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="startScreen" class="start-screen">
    <h1>森林搬搬忙</h1>
    <p>幫小動物搬木頭回小木屋，避開龍捲風，在時間內取得高分！</p>
    <button id="showNameButton">開始遊戲</button>
  </div>

  <div id="nameScreen" class="name-screen hidden">
    <h2>輸入玩家名稱</h2>
    <input id="playerName" maxlength="12" placeholder="輸入名稱">
    <button id="confirmNameButton">確認開始</button>
    <p id="nameHint"></p>
  </div>

  <main id="gameShell" class="game-shell hidden">
    <section class="top-panel">
      <div>
        <h1>森林搬搬忙</h1>
        <p>60 秒內把木頭搬回小屋，挑戰最高分。</p>
      </div>
      <div class="score-board">
        <span>時間 <strong id="timeText">60</strong></span>
        <span>分數 <strong id="scoreText">0</strong></span>
      </div>
    </section>

    <canvas id="gameCanvas" width="900" height="560"></canvas>

    <div id="gameAlert" class="game-alert hidden">
      <div class="game-alert-box">
        <h2>狐狸保護警告</h2>
        <p id="gameAlertText">不能侵門踏戶，打給動保喔!!!!</p>
        <button id="closeAlertButton">我知道了</button>
      </div>
    </div>

    <section class="bottom-panel">
      <div class="button-row">
        <button id="restartButton" disabled>重新開始</button>
      </div>
      <p id="messageText">用 WASD 或方向鍵移動，靠近木頭按 Space 撿起，再回小屋按 Space 放下。</p>
    </section>

    <section class="ranking-panel">
      <h2>本機排行榜</h2>
      <ol id="rankingList"></ol>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
